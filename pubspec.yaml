name: crypto_paper_trader
description: "Educational crypto paper-trading app. Live Binance market data, no real money."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  clock: ^1.1.2
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  webview_flutter: ^4.10.0

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.4
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  google_sign_in: ^6.2.2

  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  home_widget: ^0.7.0
  workmanager: ^0.5.2
  screenshot: ^3.0.0
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  stream_channel: ^2.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/charts/tradingview.html
    - assets/charts/lightweight-charts.standalone.production.js
